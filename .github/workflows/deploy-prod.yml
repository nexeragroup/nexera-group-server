name: Deploy server production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_ROOT: /home/yves/nexera-group/prod
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Prepare deployment folders
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 0755 '$DEPLOY_ROOT/server' '$DEPLOY_ROOT/logs' '$DEPLOY_ROOT/data' && (docker network inspect nexera-group-prod-network >/dev/null 2>&1 || docker network create nexera-group-prod-network)"

      - name: Synchronize server application
        run: |
          rsync -az --delete \
            --exclude='/.env.*' \
            --exclude='/.git/' \
            --exclude='/coverage/' \
            --exclude='/dist/' \
            --exclude='/node_modules/' \
            -e "ssh -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/server/"

      - name: Verify server runtime environment
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -f '$DEPLOY_ROOT/server/.env.prod' || { echo 'Missing server runtime environment: $DEPLOY_ROOT/server/.env.prod'; exit 1; }"

      - name: Build and run server service
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_ROOT/server' && docker compose --env-file deploy/.env.prod -f deploy/compose.prod.yml up -d --build --remove-orphans"

      - name: Verify server health
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "for attempt in \$(seq 1 12); do curl --fail --silent --show-error --resolve api.nexeragroup.rw:443:127.0.0.1 https://api.nexeragroup.rw/api/v1/health/live && exit 0; sleep 5; done; docker logs --tail=100 nexera-group-server-prod; exit 1"

      - name: Seed the default administrator
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_ROOT/server' && docker compose --env-file deploy/.env.prod -f deploy/compose.prod.yml exec -T server node dist/database/seed-default-admin.js"
